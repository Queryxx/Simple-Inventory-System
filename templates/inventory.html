<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory System</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">  
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inventory.css') }}">
    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <div class="container con mt-5">
        <button class="btn btn-danger" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>   
        <button class="btn btn-secondary" onclick="exportProducts()">
            <i class="fas fa-file-export"></i> Export Products
        </button>
        <div class="header">
            <h1 class="text-center">Inventory System</h1>
            
            <div class="search-container">
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-search input-icon"></i>
                        <input type="text" 
                               placeholder="Search products..." 
                               id="search" 
                               class="inp"
                               autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="form-data">
                
                <div class="input-group">
                    <div class="input-wrapper">
                       
                        <input type="text" id="name" name="name" placeholder="Product Name" class="inp">
                    </div>
                    <div class="input-wrapper">
                       
                        <input type="number" id="quantity" name="quantity" placeholder="Quantity" class="inp">
                    </div>
                    <div class="input-wrapper">
                       
                        <input type="text" id="unit" name="unit" placeholder=" Unit" class="inp">
                    </div>
                    <div class="input-wrapper">
                       
                        <input type="number" id="price" name="price" placeholder="Price" class="inp">
                    </div>
                    <button onclick="add()" class="btn add-btn">
                        <i class="fas fa-plus"></i>
                        Add New Product
                    </button>
                </div>
            </div>
            
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">  
                <thead>
                    <tr>
                        <th><i class="fas fa-hashtag"></i> Product ID</th>
                        <th><i class="fas fa-box"></i> Name</th>
                        <th><i class="fas fa-layer-group"></i> Quantity</th>
                        <th><i class="fas fa-ruler"></i> Unit</th>
                        <th><i class="fas fa-tag"></i> Price</th>
                        <th><i class="fas fa-cogs"></i> Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        
                    </tr>
            </table>
        </div>
        
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.js') }}"></script>
    <script src="{{ url_for('static', filename='js/inventory.js') }}"></script>
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">Edit Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit_product_id">
                <div class="mb-3">
                    <label for="edit_name" class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="edit_name">
                </div>
                <div class="mb-3">
                    <label for="edit_quantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="edit_quantity">
                </div>
                <div class="mb-3">
                    <label for="edit_unit" class="form-label">Unit</label>
                    <input type="text" class="form-control" id="edit_unit">
                </div>
                <div class="mb-3">
                    <label for="edit_price" class="form-label">Price</label>
                    <input type="number" class="form-control" id="edit_price">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-x"></i> Close</button>
                <button type="button" class="btn btn-success" onclick="updateProduct()"><i class="fas fa-save"></i> Save changes</button>
            </div>
        </div>
    </div>
</div>
<!-- Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center p-4">
                <div class="success-animation mb-4">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h4 class="modal-title mb-3" id="successTitle"></h4>
                <p class="mb-4" id="successMessage"></p>
                <button type="button" class="btn btn-success" data-bs-dismiss="modal">
                    <i class="fas fa-check"></i> OK
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center p-4">
                <div class="confirm-animation mb-4">
                    <i class="fas fa-question-circle"></i>
                </div>
                <h4 class="modal-title mb-3" id="confirmTitle"></h4>
                <p class="mb-4" id="confirmMessage"></p>
                <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="button" class="btn btn-danger" id="confirmButton">
                    <i class="fas fa-check"></i> Confirm
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
