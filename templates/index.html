
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="text">Login</h1>
            <div class="form-group">
                <div class="form-group text-center">
                    <span id="message" class="text-danger d-none"></span>
                </div>
                <label class="lbl" for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" placeholder="Username" id="username" class="inp">
            </div>
            <div class="form-group">
                <label class="lbl" for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" placeholder="Password" class="inp" id="password">
            </div>
            <button class="btn" onclick="login()">
                <i class="fas fa-sign-in-alt"></i> Login
              </button>
              
            <div class="text-center mt-3">
                <span class="text-white">Don't have an account? <a href="/register" class="link text-info">Register here</a></span>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
